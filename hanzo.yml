# Hanzo CI/CD for hanzo-apps/network: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: hanzo-network
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/hanzo-network
    platforms: [linux/amd64]
