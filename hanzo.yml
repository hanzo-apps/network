# Hanzo CI test lane, same shape as hanzoai/sites. No deploy lane:
# .hanzo/workflows/deploy.yml already builds and ships images.

test:
  - name: install
    # Lockfile or fail, so CI proves what a consumer gets.
    run: |
      set -e
      pnpm install --frozen-lockfile

  - name: typecheck
    run: |
      set -e
      pnpm typecheck

  - name: lint
    run: |
      set -e
      pnpm lint

  - name: unit
    run: |
      set -e
      pnpm test

  - name: e2e
    # Builds and serves the site itself (playwright.config.ts webServer).
    # Chromium only; the browser is fetched on first run.
    run: |
      set -e
      pnpm exec playwright install chromium
      pnpm exec playwright test
